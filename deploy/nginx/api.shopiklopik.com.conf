# MarkatPlace API — Nginx site for api.shopiklopik.com (Hostinger Ubuntu VPS).
#
# Install:  sudo cp deploy/nginx/api.shopiklopik.com.conf /etc/nginx/sites-available/api.shopiklopik.com
#           sudo ln -sf /etc/nginx/sites-available/api.shopiklopik.com /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# BEFORE INSTALLING, set the uploads root below to the real path on the server: the `root` in the
# /uploads/ location must be <application directory>/wwwroot, so that /uploads/<file> resolves to
# <application directory>/wwwroot/uploads/<file> — the folder Program.cs pins as the uploads root.
# Get it wrong and every image 404s, so `nginx -t` passing is not on its own proof the path is
# right; fetch one known image afterwards.
#
# client_max_body_size MUST equal FileUploadConstants.MaxRequestBodySizeBytes (256 MB). Nginx's
# stock default is 1m, which is what made every multi-image POST /api/workshops fail with
# "413 Content Too Large" that the browser then reported as a CORS error.
#
# Nginx, not Kestrel, is the component that rejects an oversized body in production. It compares
# Content-Length before reading the body and answers immediately with a lingering close, so the
# browser reliably receives the response; Kestrel can only refuse mid-stream, and the reset that
# follows can cost the client the reply. The error_page below therefore gives Nginx's own 413 the
# same Arabic JSON body and the CORS headers the application would have sent, so a legitimate 413
# never reaches the browser as an unexplained CORS failure. ASP.NET Core keeps the identical limit
# as a backstop for anything that reaches it directly.
#
# A test (DeploymentSafetyTests) fails the build if this file and the C# constant drift apart.

map $http_origin $cors_origin {
    default                             "";
    "https://shopiklopik.com"           $http_origin;
    "https://www.shopiklopik.com"       $http_origin;
}

# Keeps WebSockets working while every other proxied request rides a pooled, keep-alive upstream
# connection: an upgrade request forwards `Connection: upgrade`, everything else forwards an empty
# Connection header, which is what HTTP/1.1 upstream keepalive requires.
map $http_upgrade $connection_upgrade {
    default     upgrade;
    ''          '';
}

# One pool of connections to Kestrel instead of a fresh TCP handshake per request. `keepalive` is a
# per-worker idle-connection budget, not a limit on concurrency; 32 is a deliberately modest value
# for a single backend instance and should only be raised against evidence of exhaustion.
upstream markatplace {
    server 127.0.0.1:5000;

    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.shopiklopik.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.shopiklopik.com;

    ssl_certificate     /etc/letsencrypt/live/api.shopiklopik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shopiklopik.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 256m;
    client_body_buffer_size 256k;
    client_body_timeout 300s;

    proxy_request_buffering on;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    server_tokens off;

    error_page 413 = @too_large;

    location @too_large {
        internal;
        default_type application/json;
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary                             "Origin" always;
        return 413 '{"success":false,"message":"حجم الملفات اللي بتبعتها أكبر من المسموح. صغّر الصور أو الفيديو وجرّب تاني. أقصى حجم للطلب الواحد 256 ميجابايت.","data":null,"errors":null}';
    }

    # Uploaded media, served from disk instead of through Kestrel.
    #
    # The URLs are unchanged — they are the exact strings stored in the database — and so are the
    # response headers: Program.cs sends the same immutable Cache-Control, the same wildcard CORS
    # header (uploads are public files, unrelated to the credentialed API CORS policy) and the same
    # sandboxing CSP, and it refuses to serve a file whose extension it does not recognise
    # (ServeUnknownFileTypes = false). The regex below is that same allow-list, so a stray file
    # dropped into the folder is a 404 here exactly as it is in the application.
    #
    # The `types` block pins the content type of every extension the application accepts, because
    # the stock mime.types does not know .webp on older builds and knows none of .heic, .heif,
    # .hif, .avif, .avifs, .jfif, .jfi, .pjpeg, .dib, .cur, .qt or .docx. Anything not listed falls
    # back to application/octet-stream rather than being guessed at.
    location ~* ^/uploads/.+\.(jpg|jpeg|jpe|jfif|jfi|pjpeg|png|webp|gif|bmp|dib|tif|tiff|ico|cur|heic|heif|hif|avif|avifs|mp4|m4v|mov|qt|pdf|doc|docx)$ {
        root /var/www/markatplace/wwwroot;
        try_files $uri =404;

        types {
            image/jpeg   jpg jpeg jpe jfif jfi pjpeg;
            image/png    png;
            image/webp   webp;
            image/gif    gif;
            image/bmp    bmp dib;
            image/tiff   tif tiff;
            image/x-icon ico cur;
            image/heic   heic heif hif;
            image/avif   avif avifs;
            video/mp4    mp4 m4v;
            video/quicktime mov qt;
            application/pdf pdf;
            application/msword doc;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
        }
        default_type application/octet-stream;

        add_header Cache-Control            "public,max-age=31536000,immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy   "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options    "nosniff" always;

        autoindex off;
        access_log off;
    }

    # Nothing else under /uploads/ is a file the application would serve either. This stays a
    # plain prefix location, never `^~`: a `^~` match suppresses regex locations altogether and
    # would shadow the block above.
    location /uploads/ {
        return 404;
    }

    location / {
        proxy_pass http://markatplace;
        proxy_http_version 1.1;

        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location /hubs/ {
        proxy_pass http://markatplace;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
